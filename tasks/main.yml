---
- name: Download Vector DEB package
  ansible.builtin.get_url:
    url: "https://nixogen.keenetic.link/webdav/vector_{{ vector_version }}-1_amd64.deb"
    dest: "/tmp/vector-{{ vector_version }}.deb"
    mode: "0644"
    url_username: "U_M1GME"
    url_password: "{{ vector_url_password }}"

# Если Вы используете альтернативные каналы доступа, используйте этот модуль, вместо предыдущего !!!
#  tasks:
#    - name: Download Vector DEB package
#      ansible.builtin.get_url:
#        url: "https://packages.timber.io/webdav/vector_{{ vector_version }}-1_amd64.deb"
#        dest:tmp/vector-{{ vector_version }}.deb"
#        mode: "0644"
#        url_username: public
#        url_password: "{{ vector_password }}"

- name: Install Vector DEB package
  apt:
    deb: "/tmp/vector-{{ vector_version }}.deb"
    state: present
  register: vector_install

- name: Run apt-get install -f if broken dependencies detected
  apt:
    upgrade: dist
    update_cache: true
    autoremove: true
  when: vector_install is failed

- name: Ensure Vector config directory exists
  file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Vector configuration from template
  template:
    src: "templates/vector.toml.j2"
    dest: "{{ vector_config_dir }}/vector.toml"
    mode: "0644"
  notify: Restart vector service

- name: Ensure Vector service is running and enabled
  service:
    name: vector
    state: started
    enabled: true
